<!DOCTYPE html>
<html lang="en">

<head>
    <title>registration Portal</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>

<body>
    <div class="container margin-top">
        <div class="row">
            <div class="col-xs-12 text-center">
                <h1><strong>REGISTER NOW</strong></h1>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="row">

            <div class="col-md-6">
                <form action="/action_page.php">
                    <div class="form-group">
                        <label for="name">Name:</label>
                        <input type="text" class="form-control" id="name" placeholder="Enter name" name="name">
                    </div>
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" class="form-control" id="email" placeholder="Enter email" name="email">
                    </div>
                    <div class="form-group">
                        <label for="pwd">Password:</label>
                        <input type="password" class="form-control" id="pwd" placeholder="Enter password" name="pswd">
                    </div>
                    <div class="form-group">
                        <label for="city">City:</label>
                        <input type="text" class="form-control" id="city" placeholder="Enter city" name="city">
                    </div>

                    <div class="form-group">
                        <label>Select Skills:</label>
                        <div class="checkbox">
                            <label><input type="checkbox" name="option1" value="something" checked> HTML</label>
                        </div>
                        <div class="checkbox">
                            <label><input type="checkbox" name="option2" value="something"> BOOTSTRAP</label>
                        </div>
                        <div class="checkbox disabled">
                            <label><input type="checkbox" name="option3" disabled> CSS</label>
                        </div>
                    </div>

                    <div class="checkbox">
                        <label><input type="checkbox" name="remember"> Remember me</label>
                    </div>

                    <button type="submit" class="btn btn-primary">Submit</button>
                </form>
            </div>

            <div class="col-md-6 text-center">
                <div style="margin-top: 20px;">
                    <img src="logo.jfif" class="img-circle" alt="numl logo" width="200" height="200">
                </div>

                <div style="margin-top: 30px;">
                    <ul class="nav nav-pills nav-justified">
                        <li class="active"><a data-toggle="pill" href="#overview">Overview</a></li>
                        <li><a data-toggle="pill" href="#courses">Courses</a></li>
                        <li><a data-toggle="pill" href="#contact">Contact</a></li>
                    </ul>

                    <div class="tab-content" style="padding-top: 15px;">
                        <div id="overview" class="tab-pane fade in active text-left">
                            <p>bootstrap is a css framework</p>
                            <button type="button" class="btn btn-primary">REGISTER</button>
                        </div>
                        <div id="courses" class="tab-pane fade text-left">
                            <table class="table table-bordered">
                                <thead>
                                    <tr>
                                        <th>Course Name</th>
                                        <th>Fee</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>Web Development</td>
                                        <td>500</td>
                                    </tr>
                                    <tr>
                                        <td>Bootstrap Design</td>
                                        <td>1000</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div id="contact" class="tab-pane fade text-left">
                            <p>Email: info@NUML.com</p>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>
</body>

</html>
