<!DOCTYPE html>
<html>

<head>
    <title>Ninja Racing</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">
        <h1><strong>Racing Track</strong></h1>
        <p>Avoid the traffic and survive!</p>
        
        <div>
            <h1><strong>Score board</strong></h1>
            <div class="scoreboard-details">
                <p>Score: 200</p>
                <p>Speed: 120 KM/H</p>
                <p>Level: 2</p>
            </div>
            
            <div class="road">
                <div class="line"></div>
                <div class="line line2"></div>

                <div class="enemycar enemy1"></div>
                <div class="enemycar enemy2"></div>

                <div class="playercar"></div>
            </div>

            <div>
                <p> Avoid the cars!</p>
                <p> LEFT | RIGHT </p>
            </div>
            <button class="start-btn">START RACE</button>
        </div>
    </div>

</body>

</html>
